agent_services: # List all Cortex Agent services - disabled for HIPAA deployment
search_services: # List all Cortex Search services - disabled for HIPAA deployment
analyst_services: # List all Cortex Analyst semantic models/views - disabled for HIPAA deployment
other_services: # Set desired tool groups to True to enable tools for that group
  object_manager: False # Disabled - no DDL/DML operations permitted in HIPAA environment
  query_manager: True # Read-only SQL execution managed by sql_statement_permissions below
  semantic_manager: False # Disabled - semantic views not yet reviewed for HIPAA compliance
sql_statement_permissions: # Explicit read-only allowlist for HIPAA environment
  # All: False - do not uncomment; explicit allowlist below is the control
  - Alter: False
  - Command: False
  - Comment: False
  - Commit: False
  - Create: False
  - Delete: False
  - Describe: True
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Select: True
  - Transaction: False
  - TruncateTable: False
  - Unknown: False # Block any unmapped statement types - critical for HIPAA posture
  - Update: False
  - Use: False
 
